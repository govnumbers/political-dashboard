name: Rebuild site
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - build.py
      - assets/**
      # deliberately NOT data/ or site/ — data refresh is the other workflow's
      # job, and site/ is what THIS job writes (listing it would loop).
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No pip install: build.py is stdlib-only and reads the committed data/*.json.
      - name: Rebuild site from committed data
        run: python build.py
      - name: Commit rebuilt site
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/
          git diff --staged --quiet || git commit -m "Rebuild site $(date -u +%Y-%m-%dT%H:%M)"
          git push
